name: Language Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  language-stats:
    name: Generate All Languages Card
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Generate Language Statistics
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: AndreiMikh
        run: |
          set -Eeuo pipefail

          mkdir -p profile-summary-card-output

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from collections import defaultdict
          from html import escape

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GH_TOKEN"]

          API = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "AndreiMikh-language-stats",
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          # ------------------------------------------------------------------
          # Get All Eepositories Owned by the User
          # ------------------------------------------------------------------
          repositories = []

          page = 1

          while True:
              url = (
                  f"{API}/user/repos"
                  f"?visibility=all"
                  f"&affiliation=owner"
                  f"&per_page=100"
                  f"&page={page}"
              )

              data = github_get(url)

              if not data:
                  break

              repositories.extend(data)

              if len(data) < 100:
                  break

              page += 1

          print(f"Found {len(repositories)} repositories.")

          # ------------------------------------------------------------------
          # Aggregate Language Bytes Across Every Repository
          # ------------------------------------------------------------------
          language_bytes = defaultdict(int)

          scanned = 0
          skipped = 0

          for repo in repositories:
              full_name = repo["full_name"]

              # Skip Forks so the Statistics Represent Repositories Actually
              # Owned/Maintained by the Profile Rather Than Duplicated Upstream
              # Source
              if repo.get("fork", False):
                  print(f"Skipping fork: {full_name}")
                  skipped += 1
                  continue

              languages_url = repo.get("languages_url")

              if not languages_url:
                  continue

              try:
                  languages = github_get(languages_url)

                  for language, byte_count in languages.items():
                      language_bytes[language] += int(byte_count)

                  scanned += 1
                  print(f"Scanned: {full_name}")

              except Exception as error:
                  print(f"Warning: failed to scan {full_name}: {error}")

          if not language_bytes:
              raise RuntimeError("No GitHub language data was found.")

          # ------------------------------------------------------------------
          # Sort All Languages by Byte Count
          # ------------------------------------------------------------------
          languages = sorted(
              language_bytes.items(),
              key=lambda item: item[1],
              reverse=True
          )

          total_bytes = sum(language_bytes.values())

          # ------------------------------------------------------------------
          # Generate SVG
          # ------------------------------------------------------------------
          WIDTH = 900
          ROW_HEIGHT = 42
          HEADER_HEIGHT = 100
          FOOTER_HEIGHT = 55

          HEIGHT = (
              HEADER_HEIGHT
              + len(languages) * ROW_HEIGHT
              + FOOTER_HEIGHT
          )

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" height="{HEIGHT}" '
              f'viewBox="0 0 {WIDTH} {HEIGHT}">'
          )

          svg.append("""
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0d1117"/>
              <stop offset="100%" stop-color="#161b22"/>
            </linearGradient>
          </defs>
          """)

          svg.append(
              f'<rect width="{WIDTH}" height="{HEIGHT}" '
              f'rx="18" fill="url(#bg)" '
              f'stroke="#30363d"/>'
          )

          # Title
          svg.append(
              '<text x="40" y="48" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="26" font-weight="700" fill="#f0f6fc">'
              '🌌 Languages'
              '</text>'
          )

          svg.append(
              f'<text x="{WIDTH - 40}" y="47" text-anchor="end" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="14" fill="#8b949e">'
              f'{len(languages)} languages'
              '</text>'
          )

          # Divider
          svg.append(
              f'<line x1="40" y1="72" x2="{WIDTH - 40}" y2="72" '
              'stroke="#30363d"/>'
          )

          # Rows
          for index, (language, byte_count) in enumerate(languages):
              y = HEADER_HEIGHT + index * ROW_HEIGHT

              percentage = (
                  byte_count / total_bytes * 100
                  if total_bytes
                  else 0
              )

              # Logarithmicish Visual Width so Small Languages Remain Visible
              visual_width = max(
                  3,
                  int((percentage / max(
                      p for _, b in languages
                      for p in [b / total_bytes * 100]
                  )) * 500)
              )

              svg.append(
                  f'<text x="40" y="{y + 26}" '
                  'font-family="Arial, Helvetica, sans-serif" '
                  'font-size="16" fill="#f0f6fc">'
                  f'{escape(language)}'
                  '</text>'
              )

              svg.append(
                  f'<rect x="220" y="{y + 11}" '
                  f'width="500" height="16" rx="8" '
                  'fill="#21262d"/>'
              )

              svg.append(
                  f'<rect x="220" y="{y + 11}" '
                  f'width="{visual_width}" height="16" rx="8" '
                  'fill="#58a6ff"/>'
              )

              svg.append(
                  f'<text x="745" y="{y + 26}" '
                  'font-family="Arial, Helvetica, sans-serif" '
                  'font-size="14" fill="#8b949e">'
                  f'{percentage:.2f}%'
                  '</text>'
              )

              # Raw Byte Count
              if byte_count >= 1024 * 1024:
                  size = f"{byte_count / (1024 * 1024):.1f} MB"
              elif byte_count >= 1024:
                  size = f"{byte_count / 1024:.1f} KB"
              else:
                  size = f"{byte_count} B"

              svg.append(
                  f'<text x="{WIDTH - 40}" y="{y + 26}" '
                  'text-anchor="end" '
                  'font-family="Arial, Helvetica, sans-serif" '
                  'font-size="13" fill="#8b949e">'
                  f'{size}'
                  '</text>'
              )

          # Footer
          footer_y = HEIGHT - 20

          svg.append(
              f'<text x="40" y="{footer_y}" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="12" fill="#6e7681">'
              f'{scanned} repositories scanned'
              '</text>'
          )

          svg.append(
              f'<text x="{WIDTH - 40}" y="{footer_y}" '
              'text-anchor="end" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="12" fill="#6e7681">'
              'Updated automatically'
              '</text>'
          )

          svg.append("</svg>")

          output = "\n".join(svg)

          output_file = (
              "profile-summary-card-output/"
              "all-languages.svg"
          )

          with open(output_file, "w", encoding="utf-8") as file:
              file.write(output)

          print()
          print("========================================")
          print("Language Statistics Generated")
          print("========================================")

          for language, byte_count in languages:
              percentage = byte_count / total_bytes * 100

              print(
                  f"{language:20} "
                  f"{percentage:7.2f}% "
                  f"{byte_count:,} bytes"
              )

          print()
          print(f"Repositories Scanned : {scanned}")
          print(f"Repositories Skipped : {skipped}")
          print(f"Languages Detected   : {len(languages)}")
          print(f"Output               : {output_file}")
          PY

      - name: Commit Language Statistics
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/all-languages.svg

          if git diff --cached --quiet; then
            echo "ℹ️ Language Statistics are Already Up to Date"
            exit 0
          fi

          git commit -m "chore: update language statistics"
          git push
