name: 📊 Language Statistics

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  language-stats:
    name: Generate All Languages Card
    runs-on: ubuntu-latest

    steps:

      # Checkout Profile Repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Generate Language Statistics
      - name: Generate Language Statistics
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: AndreiMikh
        run: |
          set -Eeuo pipefail

          OUTPUTDIR="profile-summary-card-output"
          OUTPUTFILE="${OUTPUTDIR}/all-languages.svg"
          mkdir -p "${OUTPUTDIR}"
          echo "🌌 Generating GitHub Language Statistics"
          echo "👤 User : ${GITHUBUSERNAME}"
          echo "📄 File : ${OUTPUTFILE}"
          echo ""

          python3 <<'PY'
          import json
          import os
          import subprocess
          from collections import defaultdict
          from html import escape
          
          USERNAME = os.environ["GITHUBUSERNAME"]
          OUTPUTFILE = "profile-summary-card-output/all-languages.svg"

          # GitHub API Helper
          def gh_api(endpoint):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      endpoint,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)
          # Get All Public Repositories Owned by the Profile
          repositories = []
          page = 1
          while True:
              endpoint = (
                  f"/users/{USERNAME}/repos"
                  f"?type=owner"
                  f"&per_page=100"
                  f"&page={page}"
              )
              data = gh_api(endpoint)
              if not data:
                  break
              repositories.extend(data)

              if len(data) < 100:
                  break
              page += 1
          print(f"📦 Repositories Found: {len(repositories)}")
          print()

          # Aggregate Language Bytes
          languagebytes = defaultdict(int)
          scanned = 0
          skippedforks = 0
          failed = 0
          for repo in repositories:
              fullname = repo["full_name"]
              # Ignore Forks
              if repo.get("fork", False):
                  print(f"⏭️  Skipping Fork: {fullname}")
                  skippedforks += 1
                  continue

              # Get Repository Language Statistics
              try:
                  languages = gh_api(
                      f"/repos/{fullname}/languages"
                  )
                  for language, bytecount in languages.items():
                      languagebytes[language] += int(bytecount)
                  scanned += 1
                  print(f"✔️ Scanned: {fullname}")
              except subprocess.CalledProcessError as error:
                  failed += 1
                  errormessage = error.stderr.strip()
                  if errormessage:
                      print(
                          f"⚠️ Failed to Scan {fullname}: "
                          f"{errormessage}"
                      )
                  else:
                      print(
                          f"⚠️ Failed to Scan {fullname}"
                      )

          # Make Sure Language Data Exists
          if not languagebytes:
              raise RuntimeError(
                  "No Language Data was Returned by GitHub"
              )
          # Sort Every Detected Language
          languages = sorted(
              languagebytes.items(),
              key=lambda item: item[1],
              reverse=True,
          )
          totalbytes = sum(
              bytecount
              for _, bytecount in languages
          )
          maxbytes = max(
              bytecount
              for _, bytecount in languages
          )
          # SVG Dimensions
          WIDTH = 900
          HEADERHEIGHT = 105
          ROWHEIGHT = 43
          FOOTERHEIGHT = 60
          HEIGHT = (
              HEADERHEIGHT
              + len(languages) * ROWHEIGHT
              + FOOTERHEIGHT
          )

          # SVG
          svg = []
          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" height="{HEIGHT}" '
              f'viewBox="0 0 {WIDTH} {HEIGHT}">'
          )

          # Background
          svg.append(
              f'<rect '
              f'x="0" '
              f'y="0" '
              f'width="{WIDTH}" '
              f'height="{HEIGHT}" '
              f'rx="18" '
              f'fill="#0d1117" '
              f'stroke="#30363d"/>'
          )

          # Header
          svg.append(
              '<text '
              'x="40" '
              'y="45" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="26" '
              'font-weight="700" '
              'fill="#f0f6fc">'
              '🧾 Languages'
              '</text>'
          )
          svg.append(
              f'<text '
              f'x="{WIDTH - 40}" '
              f'y="44" '
              f'text-anchor="end" '
              f'font-family="Arial, Helvetica, sans-serif" '
              f'font-size="14" '
              f'fill="#8b949e">'
              f'{len(languages)} Languages Detected'
              f'</text>'
          )
          svg.append(
              f'<text '
              f'x="40" '
              f'y="73" '
              f'font-family="Arial, Helvetica, sans-serif" '
              f'font-size="13" '
              f'fill="#8b949e">'
              f'All NonFork Repositories'
              f'</text>'
          )
          svg.append(
              f'<line '
              f'x1="40" '
              f'y1="88" '
              f'x2="{WIDTH - 40}" '
              f'y2="88" '
              f'stroke="#30363d"/>'
          )

          # Language Rows
          for index, (language, bytecount) in enumerate(languages):
              y = HEADERHEIGHT + index * ROWHEIGHT
              percentage = (
                  bytecount / totalbytes * 100
                  if totalbytes
                  else 0
              )

              # Scale Bar Relative to Largest Language
              barwidth = max(
                  4,
                  int((bytecount / maxbytes) * 470)
              )
              # Language Name
              svg.append(
                  f'<text '
                  f'x="40" '
                  f'y="{y + 25}" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="15" '
                  f'fill="#f0f6fc">'
                  f'{escape(language)}'
                  f'</text>'
              )
              # Bar Background
              svg.append(
                  f'<rect '
                  f'x="190" '
                  f'y="{y + 10}" '
                  f'width="470" '
                  f'height="16" '
                  f'rx="8" '
                  f'fill="#21262d"/>'
              )
              # Bar
              svg.append(
                  f'<rect '
                  f'x="190" '
                  f'y="{y + 10}" '
                  f'width="{barwidth}" '
                  f'height="16" '
                  f'rx="8" '
                  f'fill="#58a6ff"/>'
              )
              # Percentage
              svg.append(
                  f'<text '
                  f'x="680" '
                  f'y="{y + 25}" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="14" '
                  f'fill="#8b949e">'
                  f'{percentage:.2f}%'
                  f'</text>'
              )
              # Human-Readable Size
              if bytecount >= 1024 * 1024:
                  size = (
                      f"{bytecount / (1024 * 1024):.1f} MB"
                  )
              elif bytecount >= 1024:
                  size = (
                      f"{bytecount / 1024:.1f} KB"
                  )
              else:
                  size = f"{bytecount} B"
              # Size
              svg.append(
                  f'<text '
                  f'x="{WIDTH - 40}" '
                  f'y="{y + 25}" '
                  f'text-anchor="end" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="13" '
                  f'fill="#6e7681">'
                  f'{size}'
                  f'</text>'
              )

          # Footer
          footery = HEIGHT - 22
          svg.append(
              f'<text '
              f'x="40" '
              f'y="{footery}" '
              f'font-family="Arial, Helvetica, sans-serif" '
              f'font-size="12" '
              f'fill="#6e7681">'
              f'{scanned} Repositories Scanned'
              f'</text>'
          )
          svg.append(
              f'<text '
              f'x="{WIDTH - 40}" '
              f'y="{footery}" '
              f'text-anchor="end" '
              f'font-family="Arial, Helvetica, sans-serif" '
              f'font-size="12" '
              f'fill="#6e7681">'
              f'Updated Automatically'
              f'</text>'
          )
          svg.append("</svg>")

          # Write SVG
          with open(
              OUTPUTFILE,
              "w",
              encoding="utf-8",
          ) as file:
              file.write("\n".join(svg))

          # Summary
          print()
          print("🎉 Language Statistics Generated")
          print()
          for language, bytecount in languages:
              percentage = (
                  bytecount / totalbytes * 100
              )
              print(
                  f"{language:20} "
                  f"{percentage:7.2f}% "
                  f"{bytecount:,} bytes"
              )
          print()
          print(f"📦 Repositories Found     : {len(repositories)}")
          print(f"🔎 Repositories Scanned   : {scanned}")
          print(f"⏭️  Forks Skipped         : {skippedforks}")
          print(f"⚠️ Failed Repositories    : {failed}")
          print(f"🌌 Languages Detected     : {len(languages)}")
          print(f"📄 Output                 : {OUTPUTFILE}")
          PY

      # Commit Generated SVG
      - name: Commit Language Statistics
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/all-languages.svg
          if git diff --cached --quiet; then
            echo "ℹ️ No Language Statistics Changes"
            exit 0
          fi
          git commit -m "chore: update language statistics"
          git push
